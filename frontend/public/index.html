<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- WCAG 2.1 AA Compliant Viewport (Enables pinch-to-zoom for accessibility) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d16" />

    <!-- SEO Meta Tags -->
    <title>Manisha Electronics - Retail POS, Stock & WhatsApp Invoicing ERP</title>
    <meta name="description" content="Manisha Electronics - Cloud Point-of-Sale, Stock Inventory, WhatsApp GST Invoicing & Ledger Management System." />
    <meta name="keywords" content="electronics POS, billing software, GST invoicing, retail inventory, Goa electronics shop, Manisha Electronics" />
    <meta name="author" content="Manisha Electronics" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://manishaelectronics.vercel.app/" />
    <meta property="og:title" content="Manisha Electronics - Retail Cloud POS & Inventory ERP" />
    <meta property="og:description" content="Modern Retail POS, Real-time Stock Management & Instant WhatsApp Invoicing for Electronics Stores." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:site_name" content="Manisha Electronics" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manisha Electronics - Retail Cloud POS" />
    <meta name="twitter:description" content="High-speed retail billing and multi-category stock management ERP." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Manisha POS" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Content Security Policy: Protects against XSS injection -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://stockmanagement07.onrender.com https://*.onrender.com http://localhost:* http://127.0.0.1:*; worker-src 'self';" />

    <!-- Preconnect to Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) for LocalBusiness & Retail POS -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ElectronicsStore",
      "name": "Manisha Electronics",
      "description": "Retail Electronics, Home Appliances, Smart TVs, Air Conditioners & Cloud Billing POS",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "EDEN GROVE Building, Nr. State Bank of India",
        "addressLocality": "Valpoi",
        "addressRegion": "Goa",
        "addressCountry": "IN"
      },
      "telephone": "+91-9309736172",
      "priceRange": "₹₹",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "09:30",
          "closes": "20:30"
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Manisha Electronics POS.</noscript>

    <!-- Shell Splash Screen: Rendered instantly before JavaScript bundle parses -->
    <div id="root">
      <div id="initial-splash-screen" style="
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d16;
        color: #f9fafb;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      ">
        <style>
          @keyframes splash-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
          }
          @keyframes splash-bar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
        <div style="
          width: 72px;
          height: 72px;
          border-radius: 20px;
          background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
          border: 1px solid rgba(245, 158, 11, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 34px;
          margin-bottom: 20px;
          box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.25);
          animation: splash-pulse 2s infinite ease-in-out;
        ">
          🏪
        </div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px;">
          MANISHA <span style="color: #f59e0b;">ELECTRONICS</span>
        </div>
        <div style="font-size: 13px; color: #94a3b8; font-weight: 500; margin-bottom: 24px;">
          Enterprise Cloud Retail POS &amp; Inventory
        </div>
        <div style="
          width: 180px;
          height: 4px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        ">
          <div style="
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 9999px;
            animation: splash-bar 1.5s infinite ease-in-out;
          "></div>
        </div>
      </div>
    </div>
  </body>
</html>
