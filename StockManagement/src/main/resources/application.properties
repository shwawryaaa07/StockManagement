# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Server Configuration
server.port=${PORT:8080}

# Shop Configuration (override via env vars in production)
shop.name=${SHOP_NAME:MANISHA ELECTRONICS}
shop.address=${SHOP_ADDRESS:EDEN GROVE Building, Nr. State Bank of India, Valpoi, Goa}
shop.phone=${SHOP_PHONE:9309736172}
shop.gstin=${SHOP_GSTIN:30AMYPN1753F1ZY}

# Security & Authentication Configuration
auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration-days=${JWT_EXPIRY_DAYS:30}
auth.admin.username=${ADMIN_USERNAME}
auth.admin.password=${ADMIN_PASSWORD}
auth.admin.pin=${ADMIN_PIN}