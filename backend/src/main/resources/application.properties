# Database Configuration (supports both DB_* and SPRING_DATASOURCE_* env vars)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Shop Configuration (override via env vars in production)
shop.name=${SHOP_NAME:MANISHA ELECTRONICS}
shop.address=${SHOP_ADDRESS:EDEN GROVE Building, Nr. State Bank of India, Valpoi, Goa}
shop.phone=${SHOP_PHONE:9309736172}
shop.gstin=${SHOP_GSTIN:30AMYPN1753F1ZY}

# Security & Authentication Configuration
auth.jwt.secret=${JWT_SECRET:${AUTH_JWT_SECRET}}
auth.jwt.expiration-days=${JWT_EXPIRY_DAYS:30}
auth.admin.username=${ADMIN_USERNAME:${AUTH_ADMIN_USERNAME:admin}}
auth.admin.password=${ADMIN_PASSWORD:${AUTH_ADMIN_PASSWORD}}
auth.admin.pin=${ADMIN_PIN:${AUTH_ADMIN_PIN}}